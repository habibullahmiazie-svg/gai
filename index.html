  }else if(tab==="rep"){h=`<h1>রিপোর্ট<small>${roll?"রোল "+roll:OWNER}</small></h1>`;b=repHTML()}

async function saveRep(){
  if(!R)return;const o={name:R.name||"",reg:R.reg||"",month:R.month||"",days:R.days};
  const{error}=admin?await sb.from("reports").update({...o,updated_at:new Date().toISOString()}).eq("roll",roll):await sb.rpc("report_save",{p_roll:roll,p_pin:PIN,p_name:o.name,p_reg:o.reg,p_month:o.month,p_days:o.days});
  const s=$("#ss");if(s)s.textContent=error?"⚠️ সেভ হয়নি, ইন্টারনেট দেখুন":"✓ সেভ হয়েছে"
}

/* ---------- forms ---------- */
function bookForm(id){
  const b=id?books.find(x=>x.id===id):{title:"",cover_path:null};let f=null;
  sheet(`<h2>${id?"বই এডিট":"নতুন বই"}</h2><label>বইয়ের নাম</label><input type="text" id="bt" value="${esc(b.title)}"><label>কভার ছবি</label><div class="pv" id="pv" style="${b.cover_path?`background-image:url(${pub(b.cover_path)})`:""}"></div><label class="btn alt rel">কভার ছবি বাছাই করুন<input type="file" id="cf" accept="image/*" class="ov"></label><button class="btn" id="sv">সেভ করুন</button>${id?`<button class="btn dg" id="dl">এই বই মুছুন</button>`:""}<button class="btn alt" onclick="shut()">বাতিল</button>`);
  $("#cf").onchange=e=>{f=e.target.files[0];if(f)$("#pv").style.backgroundImage=`url(${URL.createObjectURL(f)})`};
  $("#sv").onclick=()=>run(async()=>{
    let cp=b.cover_path;if(f){cp=await up(await shrink(f,700),"covers","jpg","image/jpeg");if(b.cover_path)await rm([b.cover_path])}
    const t=$("#bt").value.trim()||"নতুন বই";
    await q(id?sb.from("books").update({title:t,cover_path:cp}).eq("id",id):sb.from("books").insert({dept:N.d,sem:N.s,title:t,cover_path:cp}));
    await loadBooks();shut();view()});
  if(id)$("#dl").onclick=()=>ask(`“${b.title}” ও এর সব ছবি মুছে যাবে।`,async()=>{const ps=(await q(sb.from("book_pages").select("path").eq("book_id",id))).map(x=>x.path);if(b.cover_path)ps.push(b.cover_path);await rm(ps);await q(sb.from("books").delete().eq("id",id));await loadBooks()});
}
function show(i){
  vi=i;const p=pages[vi];
  $("#vw").innerHTML=p?`<div class="vt"><button data-a="vx">✕ বন্ধ</button><span>${vi+1} / ${pages.length}</span>${admin?`<button data-a="vd">🗑</button>`:"<i></i>"}</div><div class="vs"><img src="${pub(p.path)}" alt=""></div><div class="vt"><button data-a="vp">‹ আগে</button><button data-a="vn">পরে ›</button></div>`:"";
  $("#vw").classList.toggle("on",!!p);
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,i=el.dataset.i;
  if(["be","ba","sd","vd","nm","pr"].includes(a)&&!admin)return;
  switch(a){
    case"tab":tab=i;N={d:null,s:null,b:null};roll=null;R=null;if(tab==="home")await run(loadBooks);if(tab==="rep"&&admin)await run(loadRolls);view();break;
    case"d":N.d=+i;view();break;
    case"s":N.s=+i;if(tab==="syl")await run(loadSyl);view();break;
    case"back":if(N.b!==null)N.b=null;else if(N.s!==null)N.s=null;else N.d=null;view();break;
    case"bk":N.b=i;await run(loadPages);view();break;
    case"be":e.stopPropagation();bookForm(i);break;
    case"ba":bookForm(null);break;
    case"sh":show(+i);break;
    case"vx":$("#vw").classList.remove("on");view();break;
    case"vp":show((vi+pages.length-1)%pages.length);break;
    case"vn":show((vi+1)%pages.length);break;
    case"vd":ask("এই ছবিটি মুছে যাবে।",async()=>{const p=pages[vi];await rm([p.path]);await q(sb.from("book_pages").delete().eq("id",p.id));await loadPages();show(Math.min(vi,pages.length-1))});break;
    case"sd":ask("ফাইলটি মুছে যাবে।",async()=>{const f=syl.find(x=>x.id===i);await rm([f.path]);await q(sb.from("syllabus").delete().eq("id",i));await loadSyl()});break;
    case"ro":openRep();break;
    case"rs":openRep(i);break;
    case"rx":R=null;roll=null;if(admin)await run(loadRolls);view();break;
    case"nm":ask("সব তারিখের ঘর খালি হয়ে যাবে। নাম, রোল ও রেজিস্ট্রেশন থাকবে।",async()=>{R.days=Array.from({length:30},()=>({}));R.month="";await saveRep()});break;
    case"pr":ask("এই রোলের PIN মুছে যাবে, ছাত্র নতুন PIN দিতে পারবে।",async()=>{await q(sb.from("reports").update({pin_hash:null}).eq("roll",roll))});break;
    case"pc":sheet(`<h2>নতুন PIN</h2><label>কমপক্ষে ৪ অক্ষর</label><input type="password" id="np"><p id="ne" class="er"></p><button class="btn" id="ng">সেভ করুন</button><button class="btn alt" onclick="shut()">বাতিল</button>`);
      $("#ng").onclick=()=>run(async()=>{const n=$("#np").value.trim();const{error}=await sb.rpc("report_set_pin",{p_roll:roll,p_old:PIN,p_new:n});if(error){$("#ne").textContent=em(error);return}PIN=n;shut()});break;
    case"li":{busy(1);const{error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});busy(0);if(error)$("#le").textContent="ইমেইল বা পাসওয়ার্ড ভুল";else{admin=true;view()}break}
    case"lo":await sb.auth.signOut();admin=false;roll=null;R=null;view();break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;if(!R)return;
  if(t.dataset.f){R[t.dataset.f]=t.value;dirty()}
  else if(t.dataset.r&&t.type!=="checkbox"){if(t.dataset.r==="n"&&+t.value>5)t.value=5;R.days[t.dataset.d][t.dataset.r]=t.value;tt();dirty()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(R&&t.type==="checkbox"&&t.dataset.r){R.days[t.dataset.d][t.dataset.r]=t.checked;tt();dirty()}
  else if(t.id==="pf"&&admin)run(async()=>{for(const f of t.files){const p=await up(await shrink(f),"pages","jpg","image/jpeg");await q(sb.from("book_pages").insert({book_id:N.b,path:p}))}await loadPages();view()});
  else if(t.id==="sf"&&admin)run(async()=>{for(const f of t.files){if(f.size>41943040)throw{message:"৪০ MB এর বড় ফাইল দেওয়া যাবে না"};const p=await up(f,"pdf","pdf","application/pdf");await q(sb.from("syllabus").insert({dept:N.d,sem:N.s,name:f.name,path:p,size:f.size}))}await loadSyl();view()});
});
$("#md").addEventListener("click",e=>{if(e.target.id==="md")shut()});
(function(){const inApp=matchMedia("(display-mode: standalone)").matches||document.referrer.startsWith("android-app://")||navigator.standalone;let off=null;try{off=localStorage.getItem("dl_off")}catch(e){}
if(inApp||off||!/Android/i.test(navigator.userAgent))return;const b=$("#dl");b.style.display="flex";b.querySelector("button").onclick=()=>{b.style.display="none";try{localStorage.setItem("dl_off","1")}catch(e){}}})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{
  try{const{data}=await sb.auth.getSession();admin=!!data.session;sb.auth.onAuthStateChange((_e,s)=>{admin=!!s})}catch(e){}
  await run(loadBooks);view();
})();
</script></body></html>
